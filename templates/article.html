<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#f6f6f3">
  <meta name="author" content="U.U.C">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="article:published_time" content="{{DATE}}">
  <meta property="article:section" content="{{TOPIC_LABEL}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/brand/brand.css">
  <script src="/assets/js/site.js" defer></script>
  <script src="/assets/js/header-controls.js" defer></script>
  <script type="application/ld+json">{{JSON_LD}}</script>
  <title>{{TITLE}} — U.U.C</title>
</head>
<body>
<a class="skip-link" href="#article-content">Đến nội dung</a>
<header class="site-header container">
  <a class="brand" href="/" aria-label="U.U.C"><img class="brand-mark" src="/assets/brand/mark.svg" alt="" width="30" height="30"><span class="brand-copy"><span class="brand-wordmark">U.U.C</span><span class="brand-descriptor">Understand. Use. Create.</span></span></a>
  <nav aria-label="Primary">
    <a href="/">Home</a>
    <a href="/topics/">Topics</a>
    <a href="/articles/" aria-current="page">Articles</a>
    <a href="/archive/">Archive</a>
    <a href="/tags/">Tags</a>
    <a href="/about.html">About</a>
  </nav>
</header>
<main class="container">
  <article class="article" id="article-content">
    <a class="back-link" href="/topics/{{TOPIC}}/">← {{TOPIC_LABEL}}</a>
    <header class="article-header">
      <span class="type">Bài viết · {{TOPIC_LABEL}}</span>
      <h1>{{TITLE}}</h1>
      <p class="dek">{{DESCRIPTION}}</p>
      <time datetime="{{DATE}}">{{DATE_LABEL}}</time>
      <div class="article-meta" aria-label="Thẻ">
{{TAGS}}
      </div>
    </header>
    <div class="prose">
{{CONTENT}}
    </div>
  </article>
</main>
<footer class="site-footer container">
  <span>Ideas worth sharing.</span>
  <span>© 2026</span>
</footer>
</body>
</html>
