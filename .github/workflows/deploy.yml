name: Release CPM Pages
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Reviewed immutable commit SHA (40 lowercase hex characters)
        required: true
        type: string
      mode:
        description: Explicit release intent; rollback still needs artifact approval
        required: true
        type: choice
        options: [release, rollback]
permissions: {}
# Pending runs may be superseded; each deploy revalidates the latest explicit intent.
concurrency:
  group: cpm-pages-release-intent
  cancel-in-progress: false
jobs:
  authorize:
    if: github.ref == 'refs/heads/main' && vars.CPM_PAGES_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require accepted source and owner-only artifact approval
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$APPROVED_SHA^{commit}"
          git merge-base --is-ancestor "$APPROVED_SHA" origin/main
          current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$RELEASE_MODE" == release ]]; then [[ "$APPROVED_SHA" == "$current" ]]; fi
          gh api "repos/$REPOSITORY/environments/github-pages" > "$RUNNER_TEMP/cpm-environment.json"
          python3 - <<'PY'
          import json, os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/cpm-environment.json'))
          rules=[r for r in data.get('protection_rules',[]) if r.get('type')=='required_reviewers']
          reviewers=rules[0].get('reviewers',[]) if len(rules)==1 else []
          assert len(reviewers)==1 and reviewers[0]['type']=='User' and reviewers[0]['reviewer']['login'].lower()==os.environ['OWNER'].lower(), 'Owner-only required reviewer is not enforced'
          policy=data.get('deployment_branch_policy') or {}
          assert policy.get('protected_branches') or policy.get('custom_branch_policies'), 'Environment branch policy is required'
          PY
          echo "sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"
  build:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.pages.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Assert exact checkout and no persisted authentication
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]]
          if git config --get-regexp 'http\..*extraheader|credential\..*helper|credential\.helper' >/dev/null 2>&1; then exit 1; fi
      - run: npm ci
      - run: npm run verify
      - name: Record source and artifact inventory
        env:
          CPM_RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          CPM_RELEASE_RUN_ID: ${{ github.run_id }}
        run: node --import tsx scripts/release-manifest.mjs "$RUNNER_TEMP/cpm-release.json"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        id: pages
        with:
          name: github-pages-${{ github.run_id }}
          path: dist
      - name: Publish review receipt
        env:
          ARTIFACT_ID: ${{ steps.pages.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/cpm-uploaded-artifact.json"
          python3 - <<'PY'
          import json, os
          name=os.environ['RUNNER_TEMP']+'/cpm-release.json'
          receipt=json.load(open(name)); receipt['artifactId']=os.environ['ARTIFACT_ID']
          artifact=json.load(open(os.environ['RUNNER_TEMP']+'/cpm-uploaded-artifact.json'))
          assert str(artifact['id'])==receipt['artifactId'] and str(artifact['workflow_run']['id'])==receipt['runId']
          receipt['artifactDigest']=artifact['digest']
          assert receipt['artifactDigest'].startswith('sha256:'), 'Artifact digest unavailable'
          json.dump(receipt,open(name,'w'),indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
            summary.write('Review this exact artifact before approving github-pages.\n\n```json\n'+json.dumps(receipt,indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpm-release-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/cpm-release.json
          if-no-files-found: error
  deploy:
    needs: [authorize, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: cpm-pages-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cpm-release-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/cpm-receipt
      - name: Revalidate intent, source, artifact and Pages source after approval
        id: intent
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.sha }}
          EXPECTED_ARTIFACT: ${{ needs.build.outputs.artifact_id }}
          RELEASE_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/actions/workflows/deploy.yml/runs?event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/cpm-runs.json"
          gh api "repos/$REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT" > "$RUNNER_TEMP/cpm-artifact.json"
          gh api "repos/$REPOSITORY/pages" > "$RUNNER_TEMP/cpm-pages.json"
          gh api "repos/$REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/cpm-main.json"
          python3 - <<'PY'
          import json, os
          base=os.environ['RUNNER_TEMP']; run=int(os.environ['RUN_ID'])
          receipt=json.load(open(base+'/cpm-receipt/cpm-release.json'))
          artifact=json.load(open(base+'/cpm-artifact.json'))
          assert receipt['sha']==os.environ['EXPECTED_SHA'] and str(receipt['runId'])==str(run)
          assert receipt['artifactId']==os.environ['EXPECTED_ARTIFACT']==str(artifact['id'])
          assert artifact['workflow_run']['id']==run and not artifact['expired']
          assert artifact.get('digest','').startswith('sha256:'), 'Artifact digest unavailable'
          assert artifact['digest']==receipt['artifactDigest'], 'Approved artifact digest changed'
          assert json.load(open(base+'/cpm-pages.json'))['build_type']=='workflow', 'Pages Actions source not confirmed'
          if os.environ['RELEASE_MODE']=='release':
            assert json.load(open(base+'/cpm-main.json'))['object']['sha']==receipt['sha'], 'Source superseded'
          runs=json.load(open(base+'/cpm-runs.json'))['workflow_runs']
          current=not any(r['run_number']>int(os.environ['RUN_NUMBER']) and r['head_branch']=='main' for r in runs)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('current='+str(current).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary: summary.write('Approved artifact digest: '+artifact['digest']+'\nLatest intent: '+str(current)+'\n')
          assert current, 'Superseded release intent; nothing deployed'
          PY
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.intent.outputs.current == 'true'
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}
