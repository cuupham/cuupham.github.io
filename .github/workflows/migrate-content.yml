name: Migrate legacy article sources

on:
  push:
    branches:
      - main
      - refactor/content-driven-full-migration
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'push' || github.head_ref == 'refactor/content-driven-full-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Migrate legacy articles
        run: python scripts/migrate_legacy_articles.py

      - name: Commit migrated sources
        run: |
          if git diff --quiet; then
            echo "No migration changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles articles
          git commit -m "refactor(content): migrate all legacy articles"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
