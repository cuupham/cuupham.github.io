<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">C.U.U mark</title>
  <desc id="desc">Premium gradient C.U.U negative-space mark.</desc>
  <defs>
    <linearGradient id="brand-gradient" x1="35" y1="35" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.45" stop-color="#4D8DFF"/>
      <stop offset="0.78" stop-color="#22C7B7"/>
      <stop offset="1" stop-color="#9BE15D"/>
    </linearGradient>
    <linearGradient id="inner-gradient" x1="70" y1="55" x2="185" y2="205" gradientUnits="userSpaceOnUse">
