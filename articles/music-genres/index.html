<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Hiểu genre như một hệ ngôn ngữ thay vì những chiếc hộp cố định."><link rel="canonical" href="https://cuupham.github.io/articles/music-genres/"><link rel="stylesheet" href="/assets/css/site.css"><link rel="stylesheet" href="/assets/brand/brand.css"><script src="/assets/js/site.js" defer></script><script src="/assets/js/header-controls.js" defer></head><body><header class="site-header container"><a class="brand" href="/"><img class="brand-mark" src="/assets/brand/mark.svg" alt="" width="30" height="30"><span class="brand-copy"><span class="brand-wordmark">U.U.C</span><span class="brand-descriptor">Understand. Use. Create.</span></span></a><nav aria-label="Primary"><a href="/">Home</a><a href="/topics/">Topics</a><a href="/articles/">Articles</a><a href="/archive/">Archive</a><a href="/tags/">Tags</a><a href="/about.html">About</a></nav></header><main class="container"><article class="article"><p class="eyebrow">Music</p><h1>Genre không phải chiếc hộp: Cách hiểu thể loại âm nhạc</h1><p class="muted">Genre là tập hợp những convention giúp người nghe có một kỳ vọng ban đầu.</p><h2>Genre hình thành từ cộng đồng</h2><p>Nhạc sĩ, người nghe, label và truyền thông cùng tạo nên cách một genre được gọi tên. Vì vậy ranh giới giữa các thể loại luôn thay đổi.</p><h2>Convention và innovation</h2><p>Một bài thuộc genre thường dùng rhythm, harmony hoặc production quen thuộc. Nghệ sĩ có thể tuân thủ, pha trộn hoặc phá vỡ chúng để tạo bản sắc.</p><h2>Genre giúp khám phá</h2><p>Biết một vài đặc trưng giúp người nghe tìm nghệ sĩ mới nhanh hơn. Nhưng không nên dùng label để quyết định chất lượng trước khi nghe.</p><h2>Nghe xuyên thể loại</h2><p>Những kết nối thú vị thường xuất hiện ở vùng giao nhau. Jazz ảnh hưởng hip-hop, electronic ảnh hưởng pop, và nhiều scene địa phương tạo ra hybrid riêng.</p></article></main><footer class="site-footer container"><span>Ideas worth sharing.</span><span>© 2026</span></footer></body></html>
